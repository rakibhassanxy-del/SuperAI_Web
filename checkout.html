<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - Super AI Typing</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body class="bg-slate-100 flex items-center justify-center min-h-screen p-4">

    <div class="bg-white rounded-xl shadow-lg border-2 border-yellow-500 max-w-2xl w-full p-6 md:p-8">
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-2xl font-bold text-slate-800">Checkout / সাবস্ক্রিপশন</h2>
        </div>

        <div class="mb-6">
            <p class="text-sm font-bold text-slate-600 mb-1">অ্যাকাউন্ট নম্বর:</p>
            <input type="text" id="phoneInput" readonly class="w-full bg-slate-100 border border-slate-300 rounded-lg p-3 font-bold text-slate-800 cursor-not-allowed">
        </div>

        <h3 class="text-lg font-bold text-slate-700 mb-3">প্যাকেজ নির্বাচন করুন</h3>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
            <label class="border-2 border-slate-300 rounded-lg p-4 cursor-pointer hover:bg-slate-50 relative has-[:checked]:border-yellow-500 has-[:checked]:bg-yellow-50">
                <input type="radio" name="package" value="99" class="absolute opacity-0" checked>
                <div class="text-center">
                    <p class="font-bold text-slate-800">প্রিমিয়াম</p>
                    <p class="text-xl font-black text-yellow-600 my-1">৯৯ টাকা</p>
                    <p class="text-xs font-bold text-slate-500">১ মাসের প্রো</p>
                </div>
            </label>
            <label class="border-2 border-slate-300 rounded-lg p-4 cursor-pointer hover:bg-slate-50 relative has-[:checked]:border-yellow-500 has-[:checked]:bg-yellow-50">
                <input type="radio" name="package" value="290" class="absolute opacity-0">
                <div class="text-center">
                    <p class="font-bold text-slate-800">প্রিমিয়াম</p>
                    <p class="text-xl font-black text-yellow-600 my-1">২৯০ টাকা</p>
                    <p class="text-xs font-bold text-slate-500">৬ মাসের প্রো</p>
                </div>
            </label>
            <label class="border-2 border-slate-300 rounded-lg p-4 cursor-pointer hover:bg-slate-50 relative has-[:checked]:border-yellow-500 has-[:checked]:bg-yellow-50">
                <input type="radio" name="package" value="490" class="absolute opacity-0">
                <div class="text-center">
                    <p class="font-bold text-slate-800">প্রিমিয়াম</p>
                    <p class="text-xl font-black text-yellow-600 my-1">৪৯০ টাকা</p>
                    <p class="text-xs font-bold text-slate-500">১ বছরের প্রো</p>
                </div>
            </label>
        </div>

        <h3 class="text-lg font-bold text-slate-700 mb-3">পেমেন্ট পদ্ধতি</h3>
        <div class="space-y-3 mb-6">
            <div class="flex items-center justify-between bg-pink-50 border border-pink-200 rounded-lg p-4">
                <div>
                    <p class="text-sm font-bold text-pink-600">বিকাশ (পার্সোনাল - Send Money):</p>
                    <p class="text-lg font-bold text-slate-800">01643173550</p>
                </div>
                <button onclick="copyNumber('01643173550', this)" class="bg-pink-600 text-white text-sm font-bold px-4 py-2 rounded-lg hover:bg-pink-700">কপি করুন</button>
            </div>
            <div class="flex items-center justify-between bg-orange-50 border border-orange-200 rounded-lg p-4">
                <div>
                    <p class="text-sm font-bold text-orange-600">নগদ (পার্সোনাল - Send Money):</p>
                    <p class="text-lg font-bold text-slate-800">01643173550</p>
                </div>
                <button onclick="copyNumber('01643173550', this)" class="bg-orange-500 text-white text-sm font-bold px-4 py-2 rounded-lg hover:bg-orange-600">কপি করুন</button>
            </div>
        </div>

        <div class="mb-6">
            <p class="text-xs font-bold text-emerald-600 mb-2">উপরের যেকোনো একটি নম্বরে সেন্ড মানি করে নিচের বক্সে ট্রানজেকশন আইডি (TrxID) দিন:</p>
            <input type="text" id="trxInput" placeholder="যে নম্বর থেকে টাকা পাঠিয়েছেন অথবা TrxID দিন..." class="w-full border-2 border-slate-300 rounded-lg p-3 font-bold text-slate-800 focus:border-emerald-500 outline-none">
        </div>

        <div id="statusMsg" class="hidden text-center font-bold text-sky-600 mb-4"></div>

        <button id="submitBtn" onclick="submitTransaction()" class="w-full bg-emerald-500 text-white font-bold text-lg py-3 rounded-lg hover:bg-emerald-600 transition-colors">
            সাবমিট করুন
        </button>
    </div>

    <script>
        // 🚀 আপনার ফায়ারবেস কনফিগারেশন এখানে বসান
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT.firebaseapp.com",
            databaseURL: "https://YOUR_PROJECT.firebaseio.com",
            projectId: "YOUR_PROJECT",
            storageBucket: "YOUR_PROJECT.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // ইউআরএল থেকে ফোন নম্বর নেওয়া (যেমন: checkout.html?phone=01711223344)
        const urlParams = new URLSearchParams(window.location.search);
        const userPhone = urlParams.get('phone') || "Unknown User";
        document.getElementById('phoneInput').value = userPhone;

        function copyNumber(text, btn) {
            navigator.clipboard.writeText(text);
            const originalText = btn.innerText;
            btn.innerText = "✔️ কপি হয়েছে!";
            setTimeout(() => btn.innerText = originalText, 2000);
        }

        function getPackageDetails() {
            const selected = document.querySelector('input[name="package"]:checked').value;
            if (selected === "99") return { name: "Premium (1 Month)", amount: 99, days: 30 };
            if (selected === "290") return { name: "Premium (6 Months)", amount: 290, days: 180 };
            return { name: "Premium (1 Year)", amount: 490, days: 365 };
        }

        function calculateExpireDate(days) {
            const date = new Date();
            date.setDate(date.getDate() + days);
            const months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
            return `${String(date.getDate()).padStart(2, '0')} ${months[date.getMonth()]} ${date.getFullYear()}`;
        }

        function formatDate() {
            const d = new Date();
            return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}:${String(d.getSeconds()).padStart(2,'0')}`;
        }

        function submitTransaction() {
            if (userPhone === "Unknown User" || userPhone.trim() === "") {
                alert("ত্রুটি: অ্যাকাউন্টের ফোন নম্বর পাওয়া যায়নি! অ্যাপ থেকে আবার চেষ্টা করুন।");
                return;
            }

            let rawTrx = document.getElementById('trxInput').value.trim();
            if (!rawTrx) {
                alert("অনুগ্রহ করে ট্রানজেকশন আইডি দিন!");
                return;
            }

            let trxId = rawTrx;
            let resellerId = "";
            if (rawTrx.includes("//")) {
                let parts = rawTrx.split("//");
                trxId = parts[0].trim();
                resellerId = parts[1].trim().toUpperCase();
            } else if (rawTrx.includes(" ")) {
                let parts = rawTrx.split(" ");
                trxId = parts[0].trim();
                resellerId = parts[1].trim().toUpperCase();
            }

            const pkg = getPackageDetails();
            const submitBtn = document.getElementById('submitBtn');
            const statusMsg = document.getElementById('statusMsg');

            submitBtn.disabled = true;
            submitBtn.innerText = "অপেক্ষা করুন...";
            submitBtn.classList.replace("bg-emerald-500", "bg-slate-400");
            
            let timeLeft = 30;
            statusMsg.classList.remove("hidden");
            statusMsg.classList.replace("text-red-500", "text-sky-600");
            statusMsg.innerText = `⏳ আপনার পেমেন্টটি ভেরিফাই করা হচ্ছে... (${timeLeft}s)`;

            const transactionData = {
                phone: userPhone,
                package: pkg.name,
                expire_date: calculateExpireDate(pkg.days),
                amount: pkg.amount,
                reseller_id: resellerId,
                status: 'pending',
                date: formatDate()
            };

            db.ref('transactions/' + trxId).set(transactionData)
            .then(() => {
                const timer = setInterval(() => {
                    timeLeft--;
                    if (timeLeft > 0) {
                        statusMsg.innerText = `⏳ আপনার পেমেন্টটি ভেরিফাই করা হচ্ছে... (${timeLeft}s)`;
                    } else {
                        clearInterval(timer);
                        statusMsg.classList.replace("text-sky-600", "text-amber-600");
                        statusMsg.innerText = "✅ পেমেন্ট রিসিভ হয়েছে! অ্যাডমিন চেক করে শীঘ্রই আপনার একাউন্ট অ্যাক্টিভ করে দেবেন। আপনি অ্যাপে ফিরে যেতে পারেন।";
                        submitBtn.innerText = "অ্যাপ্রুভালের অপেক্ষায়";
                    }
                }, 1000);
            })
            .catch((error) => {
                statusMsg.classList.replace("text-sky-600", "text-red-500");
                statusMsg.innerText = `❌ ডাটাবেসে কানেক্ট করা যায়নি: ${error.message}`;
                submitBtn.disabled = false;
                submitBtn.innerText = "আবার সাবমিট করুন";
                submitBtn.classList.replace("bg-slate-400", "bg-emerald-500");
            });
        }
    </script>
</body>
</html>
